<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form>
    <h2>User Registration Page</h2>
    <p><b>Topic:</b> Form Validation basics</p>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Janet Gogo">
        <br><br>

        <label>Email:</label>
        <input type="email" required placeholder="janetgogo@gmail.com">
        <br><br>

           <label>Phone Number</label>
        <input type="tel" required placeholder="0813-826-6064">
        <br><br>
        
        <label>Gender:</label>
        <select name="gender"required></select>
            <option value="">--Select Gender--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <br><br>

        <label>Course:</label><br>
        <select required>
            <option valve="">--Select Course--</option>
            <option>Web Development</option>
            <option>Data Science</option>
            <option>Graphics Design</option>
        </select><br><br>

        <label>Password:</label>
        <input type="password" required placeholder="password">
        <br><br>

        <label>Comments:</label>
        <textarea placeholder="Any Comments" rows="4"></textarea>
        <br><br>

        <button type="submit">Registration</button>
    </form>

</body>
</html>
