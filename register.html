<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <h2>Please fill this form to register</h2>
    <p>Already have an account?<a href="login.html">Login here</a></p>
    <form>
        <label>Full Name</label><br>
        <input type="text" placeholder="Enter your Full Name"><br><br>
        
        <label>Email:</label><br>
        <input type="email" required placeholder="Enter your Email"><br><br>

           <label>Phone Number</label><br>
        <input type="tel" required placeholder="Enter your Phone Number"><br><br>
        
        <label>Gender:</label><br>
        <select name="gender"required>
            <option value="">--Select Gender--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <label>Course:</label><br>
        <select name="course" required>
            <option value="">--Select Course--</option>
            <option>Web Development</option>
            <option>Data Science</option>
            <option>Graphics Design</option>
        </select><br><br>

        <label>Password:</label><br>
        <input type="password" required placeholder="Enter your password"><br><br>

        <label>Comments:</label><br>
        <textarea placeholder="Any Comments" rows="4"></textarea><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
